*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none}
body{margin:0;background:#000;font-family:'Nokia Sans Wide',Arial,sans-serif;color:#ddd;display:flex;justify-content:flex-end;align-items:flex-end;min-height:100vh;padding:0 4px}
.phone{zoom:.75;width:320px;padding:14px 8px 16px;margin:8px 0 6px;border-radius:26px 26px 40px 40px;background:linear-gradient(90deg,#9aa0a0 0,#2a2e2e 1.5%,#0c0e0e 6%,#0c0e0e 94%,#2a2e2e 98.5%,#9aa0a0 100%);border:2px solid #cfd3d3;border-bottom-color:#e8eaea}
.lcd{height:112px;background:#0e1620;border:2px solid #555;border-radius:3px;padding:8px;font-size:15px}
.lcd .big{font-size:26px;color:#fff;margin-top:8px}.lcd small{color:#43bee9;display:block;margin-top:6px;font-size:13px}
.dock{position:relative;height:150px;margin-top:10px;background:linear-gradient(#303434 0,#121515 22%,#080a0a 100%);border-top:1px solid #7a7f7f;border-radius:2px}
.dock svg.ring{position:absolute;left:74px;top:5px;width:148px;height:140px}
.soft,.cs{position:absolute;width:76px;border:1px solid #343838;background:linear-gradient(#303434,#171a1a 48%,#090b0b);box-shadow:inset 0 2px 2px rgba(255,255,255,.18),inset 0 -2px 2px #000,0 2px 2px #000;color:#fff;padding:0}
.soft{height:40px;border-radius:10px}.soft:after{content:'';display:block;width:27px;height:2px;margin:0 auto;background:#f0f2f2;box-shadow:0 0 2px #fff}
.sl{left:4px;top:8px}.sr{right:4px;top:8px}
.cs{height:34px;border-radius:12px;top:62px;display:flex;align-items:center;justify-content:center}.call{left:4px}.end{right:4px}
.hi{width:24px;height:15px;pointer-events:none}.call .hi{fill:#39a861}.end .hi{fill:#d5444f;transform:rotate(180deg)}
.plate{fill:url(#sil);stroke:#414747;stroke-width:1}.well{fill:url(#well);stroke:#111}
.seg{fill:transparent;pointer-events:none}.seg.on{fill:rgba(67,190,233,.35)}
.hit{fill:transparent;cursor:pointer}.okhit{fill:transparent;cursor:pointer}
.zones .hit{fill:rgba(80,200,255,.14);stroke:#4cf;stroke-width:1}.zones .okhit{fill:rgba(255,200,60,.25);stroke:#fc4}
.arr{fill:#f3f4f4;font-size:11px;pointer-events:none;font-family:Arial}.oktxt{fill:#f3f4f4;font:700 15px 'Nokia Sans Wide',Arial;pointer-events:none}
.okface.on{fill:#2b4a5a}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:3px 4px;padding:5px 3px 4px;background:linear-gradient(90deg,#080909,#1d2020 8%,#0a0b0b 50%,#1d2020 92%,#080909)}

.key.right{flex-direction:row}.key.symbol small,.key.zero small{font-size:12px}.key.zero,.key.symbol{justify-content:center}
.key:before{content:'';position:absolute;left:3px;right:3px;top:2px;height:1px;background:linear-gradient(90deg,transparent,#9da1a1,transparent);opacity:.65}
.key span{font:700 18px/1 'Nokia Sans Wide',Arial;color:#43bee9;text-shadow:0 0 2px #06384c,0 1px #000}.key small{font:11px/1 Arial;color:#43bee9;text-shadow:0 0 2px #06384c,0 1px #000}
.soft.on,.cs.on,.key.on{filter:brightness(1.7);transform:translateY(1px)}

<script>
const out=document.getElementById('out'),log=document.getElementById('log');let h=[];
if(location.search.includes('zones'))document.body.classList.add('zones');
function fire(k){out.textContent=k;h.unshift(k);h=h.slice(0,8);log.textContent=h.join('  ');if(navigator.vibrate)navigator.vibrate(8)}
function lit(k,on){document.querySelectorAll('[data-k="'+k+'"]').forEach(e=>{if(e.classList.contains('hit')){const s=document.querySelector('.seg[data-k="'+k+'"]');s&&s.classList.toggle('on',on)}else if(e.classList.contains('okhit')){document.querySelector('.okface').classList.toggle('on',on)}else e.classList.toggle('on',on)})}
let rep=null,rt=null;
document.querySelectorAll('[data-k]').forEach(e=>{
 e.addEventListener('pointerdown',ev=>{ev.preventDefault();const k=e.dataset.k;e.setPointerCapture&&e.setPointerCapture(ev.pointerId);lit(k,true);fire(k);
  if(['up','down','left','right'].includes(k)){rt=setTimeout(()=>{rep=setInterval(()=>fire(k),110)},420)}});
 const up=()=>{clearTimeout(rt);clearInterval(rep);lit(e.dataset.k,false)};
 e.addEventListener('pointerup',up);e.addEventListener('pointercancel',up);e.addEventListener('contextmenu',x=>x.preventDefault());
});
</script></body></html>
